services:
  backend:
    build: .
    container_name: conspect-backend
    restart: always
    env_file: .env
    environment:
      - TMPDIR=/tmp/digest
      # Внутри контейнера сервер должен слушать все интерфейсы, иначе проброс порта
      # до него не доходит. Наружу это не открывает: порт ниже привязан к 127.0.0.1
      # хоста. Значение перекрывает HOST из .env — там оно для запуска без Docker.
      - HOST=0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
